# PerfectPixel GUI(리눅스)를 AppImage로 빌드해 GitHub Release 에 첨부한다.
# 헤드리스 ppgen CLI(release-ppgen.yml)와 별개인 GUI 데스크톱 앱 빌드다.
#
# 트리거: v* 태그 push (예: git tag v1.0.0 && git push --tags)
#         또는 수동 실행(workflow_dispatch).
name: release-gui

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Wails Linux deps + linuxdeploy-plugin-gtk deps.
      # webkit2gtk-4.0-dev (NOT 4.1): ubuntu-22.04 only ships the 4.0 ABI, and
      # building on the oldest supported LTS keeps the AppImage runnable on both
      # 22.04 and 24.04 (linuxdeploy bundles the 4.0 libs into the AppImage).
      - name: Install Wails Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            gobject-introspection \
            libgirepository1.0-dev \
            file \
            curl

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: perfectpixel-linux-amd64
          path: build/bin/perfectpixel-*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/perfectpixel-*.AppImage
          generate_release_notes: true